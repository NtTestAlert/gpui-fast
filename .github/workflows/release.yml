name: Git distribution validation

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'release.toml'
      - 'package.json'
      - 'bun.lock'
      - 'script/*release*'
      - 'script/prepare-consumer.ts'
      - 'docs/releasing.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize tracked symlinks
        shell: bash
        run: |
          git config core.symlinks true
          git checkout-index --all --force
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: rustup show
      - name: Find Windows SDK shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $fxc = Get-ChildItem -Path "$sdk\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "Windows SDK fxc.exe is required" }
          $fxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Check source constraints
        run: python script/check-upstream
      - name: Test generator and dependency identities
        run: bun test script/release.test.ts script/release-provenance.test.ts script/release-dependencies.test.ts
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev
      - name: Prepare default distribution and independent consumer
        run: |
          bun script/prepare-release.ts --tag v0.1.14
          bun script/prepare-consumer.ts --dest target/consumer-default
          bun script/prepare-consumer.ts --dest target/consumer-capture --capture
      - name: Check standalone default graphs
        run: |
          cargo check --manifest-path distribution/Cargo.toml --workspace --lib
          cargo check --manifest-path distribution/Cargo.toml -p gpui-fast-wgpu --lib
          cargo check --manifest-path target/consumer-default/Cargo.toml --lib
      - name: Check Web compilation
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install nightly --profile minimal --target wasm32-unknown-unknown
          cargo +nightly check --manifest-path target/consumer-default/Cargo.toml --lib --target wasm32-unknown-unknown
      - name: Check Windows capture feature
        if: runner.os == 'Windows'
        run: cargo check --manifest-path target/consumer-capture/Cargo.toml --lib --features screen-capture -j2
      - name: Upload source and dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: git-distribution-${{ matrix.os }}
          path: |
            distribution/Cargo.toml
            distribution/Cargo.lock
            distribution/*/Cargo.toml
            distribution/*/README.md
            target/consumer-default/Cargo.toml
            target/consumer-default/Cargo.lock
            target/consumer-capture/Cargo.toml
            target/consumer-capture/Cargo.lock

# This fork has no tag-triggered or registry-publication job.

# Modified by Longbridge for gpui-fast publication.
# Modified by NtTestAlert for the GPUI Fast fork.
[package]
name = "gpui-fast-windows"
version = "0.1.14"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/NtTestAlert/gpui-fast"
homepage = "https://github.com/NtTestAlert/gpui-fast"
readme = "README.md"
documentation = "https://github.com/NtTestAlert/gpui-fast"
description = "gpui_windows: GPUI with gpui-fast rendering and layout optimizations"
autoexamples = false
autobenches = false
autotests = false
authors = [ "Longbridge" ]
include = [ "/src/**", "/resources/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE" ]

[package.metadata.gpui-fast-fork]
repository = "https://github.com/NtTestAlert/gpui-fast"
source_commit = "056ef5dd4da8d55607eab9205bf463262d8305b6"
source_url = "https://github.com/NtTestAlert/gpui-fast/tree/056ef5dd4da8d55607eab9205bf463262d8305b6"
upstream_tag = "v0.1.14"
upstream_commit = "a427a7d9a6072473ad092b1673cd5235f99284cc"
import_commit = "bdae789de2ab285c7ae020506a6b62b0d0022367"
zed_commit = "d2a4fb6ded7c470be25d1541281da3882495b65b"
snapshot_version = "0.3.12"
wgpu_repository = "https://github.com/gfx-rs/wgpu"
wgpu_revision = "cddb2f5d80dc0009b2ef6767635140cacf90a007"
source_ref = "refs/heads/atrophy-gpui-fast-0.1.14"
applies_registry_patches = false

[package.metadata.gpui-fast-fork.registry_patches.crates-io.async-process]
git = "https://github.com/zed-industries/async-process.git"
rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d"

[package.metadata.gpui-fast-fork.registry_patches.crates-io.async-task]
git = "https://github.com/zed-industries/async-task.git"
rev = "015845a19fc31752c02367567d3b8900a406f9da"

[package.metadata.gpui-fast-fork.registry_patches.crates-io.windows-capture]
git = "https://github.com/zed-industries/windows-capture.git"
rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9"

[package.metadata.gpui-fast-fork.registry_patches.crates-io.calloop]
git = "https://github.com/zed-industries/calloop"
rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265"

[package.metadata.gpui-fast-fork.registry_patches.crates-io.khronos-egl]
git = "https://github.com/zed-industries/khronos-egl"
rev = "42214b36347b108fd9630ca6254b96dde59e04fe"

[package.metadata.gpui-fast-fork.registry_patches.crates-io.wasm_thread]
git = "https://github.com/zed-industries/wasm_thread"
rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937"

[package.metadata.gpui-fast-fork.registry_patch_versions]
async-process = "2.5.0"
async-task = "4.7.1"
windows-capture = "1.4.3"
calloop = "0.14.3"
khronos-egl = "6.0.0"
wasm_thread = "0.3.3"

[lib]
path = "src/gpui_windows.rs"
doctest = false
name = "gpui_windows"

[features]
default = [ "gpui/default" ]
test-support = [ "gpui/test-support" ]
screen-capture = [ "gpui/screen-capture", "scap" ]

[dependencies.gpui]
default-features = false
package = "gpui-fast"
version = "^0.1.14"
path = "../gpui"

[target."cfg(target_os = \"windows\")".dependencies]
windows-numerics = "0.3"

[target."cfg(target_os = \"windows\")".dependencies.accesskit]
version = "0.24.0"
features = [ "enumn" ]

[target."cfg(target_os = \"windows\")".dependencies.accesskit_windows]
version = "0.34"

[target."cfg(target_os = \"windows\")".dependencies.anyhow]
version = "1.0.86"

[target."cfg(target_os = \"windows\")".dependencies.collections]
version = "=0.3.12"
package = "gpui-pre-collections"

[target."cfg(target_os = \"windows\")".dependencies.dunce]
version = "1.0"

[target."cfg(target_os = \"windows\")".dependencies.etagere]
version = "0.2"

[target."cfg(target_os = \"windows\")".dependencies.futures]
version = "0.3.34"

[target."cfg(target_os = \"windows\")".dependencies.gpui_util]
package = "gpui-pre-util"
version = "=0.3.12"

[target."cfg(target_os = \"windows\")".dependencies.image]
version = "0.25.1"
default-features = false
features = [ "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp" ]

[target."cfg(target_os = \"windows\")".dependencies.itertools]
version = "0.14.0"

[target."cfg(target_os = \"windows\")".dependencies.log]
version = "0.4"
default-features = false
features = [ "std" ]

[target."cfg(target_os = \"windows\")".dependencies.parking_lot]
version = "0.12.1"

[target."cfg(target_os = \"windows\")".dependencies.rand]
version = "0.9"
default-features = false
features = [ "std", "std_rng", "os_rng" ]

[target."cfg(target_os = \"windows\")".dependencies.raw-window-handle]
version = "0.6"

[target."cfg(target_os = \"windows\")".dependencies.scheduler]
package = "gpui-pre-scheduler"
version = "=0.3.12"

[target."cfg(target_os = \"windows\")".dependencies.smallvec]
version = "1.6"
features = [ "union", "const_new" ]

[target."cfg(target_os = \"windows\")".dependencies.uuid]
version = "1.1"
features = [ "serde", "v5" ]

[target."cfg(target_os = \"windows\")".dependencies.windows]
version = "0.62"
features = [ "Data_Xml_Dom", "Foundation_Numerics", "Globalization_DateTimeFormatting", "Storage_Search", "Storage_Streams", "System_Threading", "UI_Notifications", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_DirectManipulation", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Hlsl", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Media", "Win32_System_StationsAndDesktops" ]

[target."cfg(target_os = \"windows\")".dependencies.windows-core]
version = "0.62"

[target."cfg(target_os = \"windows\")".dependencies.windows-registry]
version = "0.6.0"

[target."cfg(target_os = \"windows\")".dependencies.scap]
git = "https://github.com/zed-industries/scap"
rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac"
default-features = false
package = "zed-scap"
version = "0.0.8-zed"
optional = true

[target."cfg(target_os = \"windows\")".build-dependencies.windows-registry]
version = "0.6.0"

[lints.rust.unexpected_cfgs]
level = "allow"
